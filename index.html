.card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }

.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; color: #888; flex-wrap: wrap; gap: 8px; }
.question-number { font-weight: 600; color: #2980b9; font-size: 16px; }
.category-tag { background: #eaf2f8; color: #2980b9; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
.question-text { font-size: 17px; line-height: 1.7; margin-bottom: 20px; color: #222; font-weight: 500; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option { padding: 14px 18px; border: 2px solid #e8e8e8; border-radius: 10px; cursor: pointer; transition: all 0.25s; font-size: 15px; line-height: 1.5; display: flex; align-items: flex-start; gap: 12px; }
.option:hover { border-color: #2980b9; background: #f0f7fc; transform: translateX(4px); }
.option.selected { border-color: #3498db; background: #eaf2f8; }
.option.correct { border-color: #27ae60; background: #eafaf1; color: #1a7a3e; }
.option.wrong { border-color: #e74c3c; background: #fdf2f2; color: #c0392b; }
.option.disabled { pointer-events: none; opacity: 0.7; }
.option.disabled.correct, .option.disabled.wrong { opacity: 1; }
.option-label { min-width: 28px; height: 28px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #666; flex-shrink: 0; transition: all 0.25s; }
.option.selected .option-label { background: #3498db; color: white; }
.option.correct .option-label { background: #27ae60; color: white; }
.option.wrong .option-label { background: #e74c3c; color: white; }
.explanation { margin-top: 15px; padding: 15px; background: #fef9e7; border-left: 4px solid #f39c12; border-radius: 4px; font-size: 14px; line-height: 1.6; color: #7d6608; display: none; }
.explanation.show { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.btn { padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; transition: all 0.3s; }
.btn-primary { background: #2980b9; color: white; }
.btn-primary:hover { background: #1a5276; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(41,128,185,0.3); }
.btn-success { background: #27ae60; color: white; }
.btn-success:hover { background: #1a7a3e; }
.btn-outline { background: transparent; color: #2980b9; border: 2px solid #2980b9; }
.btn-outline:hover { background: #eaf2f8; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
.stat-card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.stat-value { font-size: 32px; font-weight: 700; margin-bottom: 5px; }
.stat-label { font-size: 13px; color: #888; }
.stat-value.green { color: #27ae60; }
.stat-value.blue { color: #2980b9; }
.stat-value.orange { color: #e67e22; }
.stat-value.red { color: #e74c3c; }
.chart-container { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
.chart-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #333; }
.chart-bar { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
.chart-label { min-width: 120px; font-size: 13px; color: #666; text-align: right; }
.chart-track { flex: 1; height: 24px; background: #f0f0f0; border-radius: 12px; overflow: hidden; }
.chart-fill { height: 100%; border-radius: 12px; transition: width 0.8s ease; display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: white; font-weight: 600; }
.wrong-item { padding: 12px 15px; background: #fdf8f8; border-left: 3px solid #e74c3c; margin-bottom: 8px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
.wrong-item:hover { background: #fde8e8; transform: translateX(3px); }
.wrong-item .wrong-q { font-size: 14px; color: #333; margin-bottom: 4px; }
.wrong-item .wrong-a { font-size: 12px; color: #e74c3c; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
.result-header { text-align: center; padding: 30px 0; }
.result-score { font-size: 64px; font-weight: 700; color: #2980b9; }
.result-label { font-size: 16px; color: #888; margin-top: 5px; }
.mode-select { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.mode-card { flex: 1; min-width: 200px; padding: 25px; border: 2px solid #e8e8e8; border-radius: 12px; cursor: pointer; transition: all 0.3s; text-align: center; }
.mode-card:hover { border-color: #2980b9; transform: translateY(-3px); box-shadow: 0 4px 15px rgba(41,128,185,0.15); }
.mode-card h3 { font-size: 18px; color: #333; margin-bottom: 8px; }
.mode-card p { font-size: 13px; color: #888; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.filter-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 20px; background: white; cursor: pointer; font-size: 13px; transition: all 0.2s; }

.empty-state .icon { font-size: 48px; margin-bottom: 15px; }
.empty-state p { font-size: 15px; }
.hidden { display: none !important; }

/* Toast notification */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

/* Mobile responsive */
@media (max-width: 600px) {
  .container { padding: 15px; }
  .card { padding: 20px; }
  .header h1 { font-size: 20px; }
  .tabs { gap: 6px; }
  .tab { padding: 8px 14px; font-size: 13px; }
  .question-text { font-size: 15px; }
  .option { padding: 12px 14px; font-size: 14px; }

</head>

<div id="toast" class="toast"></div>

<div class="container">

          <p style="margin-top:8px;color:#e67e22;font-weight:600">可选题数</p>
        </div>
        <div class="mode-card" onclick="switchPage('exam')">

          <p>限时测试，检验学习成果</p>
          <p style="margin-top:8px;color:#27ae60;font-weight:600">可设题数</p>

      </div>
    </div>
    <div class="stats-grid" id="home-stats"></div>
  </div>

    <div class="filter-bar" id="practice-filter"></div>
    <div id="practice-area"></div>
  </div>

  <!-- RANDOM -->

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn btn-outline" onclick="startRandom(10)">10题</button>
        <button class="btn btn-outline" onclick="startRandom(20)">20题</button>
        <button class="btn btn-outline" onclick="startRandom(30)">30题</button>
        <button class="btn btn-outline" onclick="startRandom(50)">50题</button>
        <button class="btn btn-primary" onclick="startRandom(100)">100题</button>
      </div>
    </div>
    <div id="random-area"></div>
  </div>

  <!-- EXAM -->
  <div id="page-exam" class="page">
    <div class="card" id="exam-setup">
      <h3 style="margin-bottom:15px">📋 模拟考试设置</h3>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
        <label style="font-size:14px">题目数量：</label>
        <select id="exam-count" style="padding:8px 15px;border:2px solid #ddd;border-radius:8px;font-size:14px">

          <option value="30">30题</option>
          <option value="50" selected>50题</option>
          <option value="100">100题</option>
          <option value="200">全部200题</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
        <label style="font-size:14px">每题时间：</label>
        <select id="exam-time" style="padding:8px 15px;border:2px solid #ddd;border-radius:8px;font-size:14px">

          <option value="60" selected>60秒</option>
          <option value="90">90秒</option>

      </div>
      <button class="btn btn-primary" onclick="startExam()" style="width:100%">开始考试</button>
    </div>
    <div id="exam-area"></div>

  <!-- WRONG -->

  </div>

  <!-- STATS -->
  <div id="page-stats" class="page">
    <div id="stats-area"></div>
  </div>
</div>

// ======== STATE ========
let currentMode = "practice";
let currentIndex = 0;
let sessionQuestions = [];
let sessionAnswers = {};
let sessionScore = { correct: 0, wrong: 0 };
let sessionStartTime = null;
let examTimer = null;
let examRemain = 0;

const CATEGORIES = ["检测指标", "基础油知识", "相容性", "稠化剂/添加剂/工艺"];
const CAT_COLORS = ["#2980b9", "#27ae60", "#e67e22", "#8e44ad"];

function getCategory(q) {
  const id = parseInt(q.id);
  if (id <= 1050) return "检测指标";
  if (id <= 1100) return "基础油知识";
  if (id <= 1150) return "相容性";
  return "稠化剂/添加剂/工艺";
}

// ======== STORAGE ========
const STORAGE_KEY = "vnovo_quiz_data_v2";

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(getData())); }
function getData() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    return d ? JSON.parse(d) : { history: [], wrong: [] };
  } catch(e) { return { history: [], wrong: [] }; }
}

function addRecord(type, total, correct, time) {
  const data = getData();
  data.history.push({ type, total, correct, time, date: new Date().toLocaleDateString() });
  if (data.history.length > 500) data.history = data.history.slice(-500);
  saveData();
}

function addWrong(qId) {
  const data = getData();
  if (!data.wrong.includes(qId)) { data.wrong.push(qId); saveData(); }
}

function removeWrong(qId) {
  const data = getData();
  data.wrong = data.wrong.filter(id => id !== qId);
  saveData();
}

// ======== UTILS ========
function getQuestionById(id) { return ALL_QUESTIONS.find(q => q.id === id); }
function keyMap(a) { return { A: "optionA", B: "optionB", C: "optionC", D: "optionD" }[a]; }
function formatTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// ======== NAVIGATION ========
function switchPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  const el = document.getElementById("page-" + page);
  if (el) el.classList.add("active");
  document.querySelectorAll(".tab").forEach(t => { if (t.dataset.page === page) t.classList.add("active"); });

  if (page === "home") renderHome();
  if (page === "practice") initPractice();
  if (page === "random") document.getElementById("random-setup").classList.remove("hidden");
  if (page === "exam") document.getElementById("exam-setup").classList.remove("hidden");
  if (page === "wrong") renderWrong();
  if (page === "stats") renderStats();
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => switchPage(t.dataset.page));
});

// ======== HOME ========
function renderHome() {
  const data = getData();
  const td = data.history.reduce((s, r) => s + r.total, 0);
  const tc = data.history.reduce((s, r) => s + r.correct, 0);
  const acc = td > 0 ? Math.round(tc / td * 100) : 0;

  document.getElementById("home-stats").innerHTML =
    '<div class="stat-card"><div class="stat-value blue">' + td + '</div><div class="stat-label">累计做题</div></div>' +
    '<div class="stat-card"><div class="stat-value green">' + tc + '</div><div class="stat-label">答对题数</div></div>' +
    '<div class="stat-card"><div class="stat-value orange">' + acc + '%</div><div class="stat-label">正确率</div></div>' +
    '<div class="stat-card"><div class="stat-value red">' + data.wrong.length + '</div><div class="stat-label">错题数量</div></div>';
}

// ======== PRACTICE ========
let practiceFilter = "all";

function initPractice() {
  currentIndex = 0;
  const el = document.getElementById("practice-filter");
  let h = '<button class="filter-btn ' + (practiceFilter === "all" ? "active" : "") + '" data-cat="all">全部</button>';
  CATEGORIES.forEach(c => {
    h += '<button class="filter-btn ' + (practiceFilter === c ? "active" : "") + '" data-cat="' + c + '">' + c + '</button>';
  });
  el.innerHTML = h;
  el.querySelectorAll(".filter-btn").forEach(b => {
    b.addEventListener("click", () => { practiceFilter = b.dataset.cat; initPractice(); });
  });

  let qs = ALL_QUESTIONS;
  if (practiceFilter !== "all") qs = qs.filter(q => getCategory(q) === practiceFilter);

  sessionQuestions = qs;
  sessionAnswers = {};
  sessionScore = { correct: 0, wrong: 0 };
  sessionStartTime = Date.now();
  currentMode = "practice";
  renderQuestion();
}

// ======== RENDER QUESTION ========
function renderQuestion() {
  if (currentIndex >= sessionQuestions.length) { showResult(); return; }

  const q = sessionQuestions[currentIndex];
  const cat = getCategory(q);
  const ci = CATEGORIES.indexOf(cat);
  const progress = (currentIndex / sessionQuestions.length * 100).toFixed(1);
  const answered = sessionAnswers[q.id] !== undefined;
  const area = currentMode === "practice" ? "practice-area" : currentMode === "random" ? "random-area" : "exam-area";

  let oh = "";
  ["A", "B", "C", "D"].forEach((lbl, i) => {
    const key = ["optionA", "optionB", "optionC", "optionD"][i];
    const val = q[key];
    let cls = "";
    if (answered) {
      if (lbl === q.answer) cls = "correct";
      else if (sessionAnswers[q.id] === lbl) cls = "wrong";
      cls += " disabled";
    }
    oh += '<div class="option ' + cls + '" data-qid="' + q.id + '" data-lbl="' + lbl + '">' +
          '<span class="option-label">' + lbl + '</span><span>' + val + '</span></div>';
  });

  let timerHtml = "";
  if (currentMode === "exam") {
    timerHtml = '<span style="color:#e74c3c;font-weight:600">⏱ ' + formatTime(examRemain) + '</span>';
  }

  let expHtml = "";
  if (answered) {
    const ansKey = keyMap(q.answer);
    expHtml = '<div class="explanation show">💡 正确答案: ' + q.answer + '. ' + q[ansKey] +
              (q.explanation ? '<br>' + q.explanation : '') + '</div>';
  }

  document.getElementById(area).innerHTML =
    '<div class="card">' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
    '<div class="question-header">' +
    '<span class="question-number">第 ' + (currentIndex + 1) + ' / ' + sessionQuestions.length + ' 题</span>' +
    '<span class="category-tag" style="background:' + CAT_COLORS[ci] + '20;color:' + CAT_COLORS[ci] + '">' + cat + '</span>' +
    timerHtml +
    '</div>' +
    '<div class="question-text">' + q.question + '</div>' +
    '<div class="options">' + oh + '</div>' +
    expHtml +
    '<div class="btn-row">' +
    '<button class="btn btn-outline" id="prev-btn"' + (currentIndex === 0 ? ' disabled' : '') + '>⬅ 上一题</button>' +
    '<button class="btn ' + (answered && currentIndex < sessionQuestions.length - 1 ? 'btn-primary' : 'btn-success') + '" id="next-btn"' + (!answered ? ' disabled' : '') + '>' +
    (currentIndex === sessionQuestions.length - 1 ? '✅ 提交' : '下一题 ➡') +
    '</button></div></div>';

  // Bind option clicks
  document.getElementById(area).querySelectorAll(".option:not(.disabled)").forEach(o => {
    o.addEventListener("click", () => selectOpt(o.dataset.qid, o.dataset.lbl));
  });

  // Bind nav buttons
  document.getElementById("prev-btn").addEventListener("click", prevQ);
  document.getElementById("next-btn").addEventListener("click", nextQ);
}

// ======== ANSWER LOGIC ========
function selectOpt(qId, lbl) {
  if (sessionAnswers[qId] !== undefined) return;
  sessionAnswers[qId] = lbl;
  const q = getQuestionById(qId);
  if (lbl === q.answer) {
    sessionScore.correct++;
    showToast("✅ 回答正确！");
  } else {
    sessionScore.wrong++;
    addWrong(qId);
    showToast("❌ 回答错误，正确答案是 " + q.answer);
  }
  renderQuestion();
}

function prevQ() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function nextQ() {
  if (sessionAnswers[sessionQuestions[currentIndex].id] === undefined) return;
  if (currentIndex < sessionQuestions.length - 1) { currentIndex++; renderQuestion(); }
  else showResult();
}

// ======== RANDOM ========
function startRandom(n) {
  currentMode = "random";
  document.getElementById("random-setup").classList.add("hidden");
  const s = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5);
  sessionQuestions = s.slice(0, Math.min(n, ALL_QUESTIONS.length));
  currentIndex = 0; sessionAnswers = {}; sessionScore = { correct: 0, wrong: 0 }; sessionStartTime = Date.now();
  showToast("🎲 已随机抽取 " + sessionQuestions.length + " 题");
  renderQuestion();
}

// ======== EXAM ========
function startExam() {
  currentMode = "exam";
  document.getElementById("exam-setup").classList.add("hidden");
  const cnt = parseInt(document.getElementById("exam-count").value);
  const perQ = parseInt(document.getElementById("exam-time").value);
  const s = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5);
  sessionQuestions = s.slice(0, Math.min(cnt, ALL_QUESTIONS.length));
  currentIndex = 0; sessionAnswers = {}; sessionScore = { correct: 0, wrong: 0 }; sessionStartTime = Date.now();
  examRemain = cnt * perQ;
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(() => {
    examRemain--;
    if (examRemain <= 0) { clearInterval(examTimer); examTimer = null; showToast("⏰ 时间到！自动提交"); showResult(); return; }
    if (currentIndex < sessionQuestions.length) renderQuestion();
  }, 1000);
  showToast("📋 考试开始！共 " + sessionQuestions.length + " 题");
  renderQuestion();
}

// ======== RESULT ========
function showResult() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  const elapsed = Math.round((Date.now() - sessionStartTime) / 1000);
  const total = sessionQuestions.length;
  const correct = sessionScore.correct;
  const accuracy = Math.round(correct / total * 100);
  const type = currentMode === "practice" ? "顺序刷题" : currentMode === "random" ? "随机刷题" : "模拟考试";

  addRecord(type, total, correct, elapsed);

  // Remove from wrong list if answered correctly
  const data = getData();
  sessionQuestions.forEach(q => {
    if (sessionAnswers[q.id] === q.answer && data.wrong.includes(q.id)) removeWrong(q.id);
  });

  const area = currentMode === "practice" ? "practice-area" : currentMode === "random" ? "random-area" : "exam-area";

  let wh = "";
  sessionQuestions.forEach(q => {
    if (sessionAnswers[q.id] !== q.answer) {
      wh += '<div class="wrong-item"><div class="wrong-q">❌ ' + q.question + '</div>' +
            '<div class="wrong-a">你的答案: ' + (sessionAnswers[q.id] || "未作答") + ' | 正确答案: ' + q.answer + ' (' + q[keyMap(q.answer)] + ')</div></div>';
    }
  });

  document.getElementById(area).innerHTML =
    '<div class="card">' +
    '<div class="result-header">' +
    '<div class="result-score">' + accuracy + '<span style="font-size:24px">%</span></div>' +
    '<div class="result-label">正确率 · ' + type + '</div>' +
    '<p style="margin-top:10px;color:#666">答对 ' + correct + '/' + total + ' 题 · 用时 ' + formatTime(elapsed) + '</p>' +
    '</div>' +
    '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-value green">' + correct + '</div><div class="stat-label">答对</div></div>' +
    '<div class="stat-card"><div class="stat-value red">' + sessionScore.wrong + '</div><div class="stat-label">答错</div></div>' +
    '<div class="stat-card"><div class="stat-value blue">' + formatTime(elapsed) + '</div><div class="stat-label">用时</div></div>' +
    '<div class="stat-card"><div class="stat-value orange">' + accuracy + '%</div><div class="stat-label">正确率</div></div>' +
    '</div>' +
    (wh ? '<div class="chart-title" style="margin-top:15px">❌ 本次答错的题目 (' + sessionScore.wrong + '题)</div>' + wh
        : '<div style="text-align:center;padding:20px;color:#27ae60;font-size:18px">🎉 全部答对！太棒了！</div>') +
    '<div class="btn-row" style="justify-content:center;margin-top:25px">' +
    '<button class="btn btn-primary" id="back-home-btn">🏠 返回首页</button>' +
    '<button class="btn btn-success" id="retry-btn">🔄 再来一次</button></div></div>';

  document.getElementById("back-home-btn").addEventListener("click", () => switchPage("home"));
  document.getElementById("retry-btn").addEventListener("click", () => location.reload());
}

// ======== WRONG BOOK ========
function renderWrong() {
  const data = getData();
  const area = document.getElementById("wrong-area");
  if (!data.wrong.length) {
    area.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>暂无错题，继续加油！</p></div>';
    return;
  }

  let h = '<div class="card"><div class="chart-title">❌ 错题本（' + data.wrong.length + '题）</div>';
  data.wrong.forEach(qId => {
    const q = getQuestionById(qId);
    if (!q) return;
    h += '<div class="wrong-item" data-qid="' + qId + '">' +
         '<div class="wrong-q">[' + qId + '] ' + q.question + '</div>' +
         '<div class="wrong-a">正确答案: ' + q.answer + ' · ' + q[keyMap(q.answer)] + '</div></div>';
  });
  h += '<div style="text-align:center;margin-top:15px">' +
       '<button class="btn btn-outline" id="clear-wrong-btn" style="color:#e74c3c;border-color:#e74c3c">🗑️ 清空错题本</button>' +
       '<button class="btn btn-primary" id="retry-wrong-btn" style="margin-left:10px">🔄 重做错题</button></div></div>';
  area.innerHTML = h;

  document.getElementById("clear-wrong-btn").addEventListener("click", clearWrong);
  document.getElementById("retry-wrong-btn").addEventListener("click", retryWrong);

  area.querySelectorAll(".wrong-item").forEach(item => {
    item.addEventListener("click", () => reviewWrong(item.dataset.qid));
  });
}

function clearWrong() {
  if (confirm("确定清空所有错题记录？")) {
    const d = getData(); d.wrong = []; saveData(); renderWrong();
    showToast("错题本已清空");
  }
}

function retryWrong() {
  const data = getData();
  if (!data.wrong.length) return;
  currentMode = "practice";
  switchPage("practice");
  sessionQuestions = data.wrong.map(id => getQuestionById(id)).filter(Boolean);
  currentIndex = 0; sessionAnswers = {}; sessionScore = { correct: 0, wrong: 0 }; sessionStartTime = Date.now();
  showToast("🔄 开始重做 " + sessionQuestions.length + " 道错题");
  renderQuestion();
}

function reviewWrong(qId) {
  const q = getQuestionById(qId);
  if (!q) return;
  const area = document.getElementById("wrong-area");
  let oh = "";
  ["A", "B", "C", "D"].forEach((lbl, i) => {
    const key = ["optionA", "optionB", "optionC", "optionD"][i];
    const cls = lbl === q.answer ? "correct" : "";
    oh += '<div class="option ' + cls + ' disabled"><span class="option-label">' + lbl + '</span><span>' + q[key] + '</span></div>';
  });

  area.innerHTML =
    '<div class="card">' +
    '<div class="question-header"><span class="question-number">错题回顾 · #' + qId + '</span><span class="category-tag">' + getCategory(q) + '</span></div>' +
    '<div class="question-text">' + q.question + '</div>' +
    '<div class="options">' + oh + '</div>' +
    '<div class="explanation show">💡 正确答案: ' + q.answer + '. ' + q[keyMap(q.answer)] + (q.explanation ? '<br>' + q.explanation : '') + '</div>' +
    '<div class="btn-row"><button class="btn btn-outline" id="back-wrong-btn">⬅ 返回错题本</button>' +
    '<button class="btn btn-success" id="remove-wrong-btn" style="margin-left:auto">✅ 已掌握，移出错题</button></div></div>';

  document.getElementById("back-wrong-btn").addEventListener("click", renderWrong);
  document.getElementById("remove-wrong-btn").addEventListener("click", () => {
    removeWrong(qId);
    showToast("已从错题本移除");
    renderWrong();
  });
}

// ======== STATS ========
function renderStats() {
  const data = getData();
  const area = document.getElementById("stats-area");
  const td = data.history.reduce((s, r) => s + r.total, 0);
  const tc = data.history.reduce((s, r) => s + r.correct, 0);
  const acc = td > 0 ? Math.round(tc / td * 100) : 0;

  // Category distribution
  const qcc = {};
  CATEGORIES.forEach(c => qcc[c] = 0);
  ALL_QUESTIONS.forEach(q => qcc[getCategory(q)]++);

  let h =
    '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-value blue">' + td + '</div><div class="stat-label">累计做题</div></div>' +
    '<div class="stat-card"><div class="stat-value green">' + tc + '</div><div class="stat-label">答对题数</div></div>' +
    '<div class="stat-card"><div class="stat-value orange">' + acc + '%</div><div class="stat-label">总正确率</div></div>' +
    '<div class="stat-card"><div class="stat-value red">' + data.wrong.length + '</div><div class="stat-label">待复习错题</div></div>' +
    '</div>';

  // Category chart
  h += '<div class="chart-container"><div class="chart-title">📚 题库分类分布</div>';
  CATEGORIES.forEach((c, i) => {
    const pct = (qcc[c] / ALL_QUESTIONS.length * 100).toFixed(1);
    h += '<div class="chart-bar"><span class="chart-label">' + c + '</span>' +
         '<div class="chart-track"><div class="chart-fill" style="width:' + pct + '%;background:' + CAT_COLORS[i] + '">' + qcc[c] + '题</div></div></div>';
  });
  h += '</div>';

  // History chart
  h += '<div class="chart-container"><div class="chart-title">📈 做题记录（最近20次）</div>';
  if (!data.history.length) {
    h += '<p style="color:#aaa;text-align:center;padding:20px">暂无记录</p>';
  } else {
    data.history.slice(-20).reverse().forEach(r => {
      const pct = r.total > 0 ? Math.round(r.correct / r.total * 100) : 0;
      const bg = pct >= 80 ? "#27ae60" : pct >= 60 ? "#f39c12" : "#e74c3c";
      h += '<div class="chart-bar"><span class="chart-label">' + r.date + '</span>' +
           '<div class="chart-track"><div class="chart-fill" style="width:' + pct + '%;background:' + bg + '">' +
           r.type + ' ' + r.correct + '/' + r.total + ' (' + pct + '%)</div></div></div>';
    });
  }
  h += '</div>';

  // Clear data button
  h += '<div style="text-align:center;margin-top:20px">' +
       '<button class="btn btn-outline" id="clear-all-btn" style="color:#e74c3c;border-color:#e74c3c">🗑️ 清除所有学习数据</button></div>';

  area.innerHTML = h;
  document.getElementById("clear-all-btn").addEventListener("click", clearAll);
}

function clearAll() {
  if (confirm("确定清除所有学习记录和错题？此操作不可恢复！")) {
    localStorage.removeItem(STORAGE_KEY);
    renderStats();
    renderHome();
    showToast("所有数据已清除");
  }
}

// ======== KEYBOARD SHORTCUTS ========
document.addEventListener("keydown", (e) => {
  if (["practice", "random", "exam"].includes(currentMode) && currentIndex < sessionQuestions.length) {
    const q = sessionQuestions[currentIndex];
    if (sessionAnswers[q.id] === undefined) {
      if (e.key === "1" || e.key === "a" || e.key === "A") selectOpt(q.id, "A");
      if (e.key === "2" || e.key === "b" || e.key === "B") selectOpt(q.id, "B");
      if (e.key === "3" || e.key === "c" || e.key === "C") selectOpt(q.id, "C");
      if (e.key === "4" || e.key === "d" || e.key === "D") selectOpt(q.id, "D");
    }
    if (e.key === "ArrowLeft") prevQ();
    if (e.key === "ArrowRight" && sessionAnswers[q.id] !== undefined) nextQ();
  }
});

// ======== INIT ========
renderHome();
</script>
</body>
</html>
